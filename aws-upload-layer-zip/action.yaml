name: Upload layer files
description: Create a zip of layer files and upload to S3. Outputs S3 object version
inputs:
  python-version:
    description: version of python to use
    required: false
    default: "3.11"
  platform:
    description: platform for python wheels
    required: false
    default: "manylinux2014_x86_64"
  packages:
    description: packages to install
    required: true
  layer-file-name:
    description: Layer name
    required: true
  s3-bucket-name:
    description: S3 bucket name
    required: true
  s3-layers-location:
    description: S3 location key for layers
    required: true
  gh-token:
    description: github token for private repo download
    required: false
    default: ""

outputs:
  s3-object-version:
    description: VersionId of uploaded object
    value: ${{ steps.dependencies-zip-to-s3.outputs.version-id }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    
    - name: Create dependencies zip
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.gh-token }}
      run: |
        sudo apt install -y zip
        mkdir -p ./python
        if [ -n "$GITHUB_TOKEN" ]; then
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/Actaware".insteadOf "https://github.com/Actaware"
        fi
        python -m pip install --upgrade pip
        pip install --platform ${{ inputs.platform }} --only-binary=:all: ${{ inputs.packages }} -t ./python
        zip -r ${{ inputs.layer-file-name }} ./python -x "*pycache*"
        rm -rf ./python

    - name: Upload dependencies zip to S3
      id: "dependencies-zip-to-s3"
      uses: "actaware/actions/aws-s3-upload@dev"
      with:
        file-path: ${{ inputs.layer-file-name }}
        s3-bucket-name: ${{ inputs.s3-bucket-name }}
        s3-object-key: "${{ inputs.s3-layers-location }}${{ inputs.layer-file-name }}"
