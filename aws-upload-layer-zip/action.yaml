name: Upload layer files
description: Create a zip of layer files and upload to S3. Outputs S3 object version
inputs:
  python-version:
    description: version of python to use
    required: false
    default: "3.12"
  platform:
    description: platform for python wheels
    required: false
    default: "x86_64-manylinux_2_28"
  packages:
    description: packages to install
    required: true
  layer-file-name:
    description: Layer name
    required: true
  s3-bucket-name:
    description: S3 bucket name
    required: true
  s3-layers-location:
    description: S3 location key for layers
    required: true
  gh-token:
    description: github token for private repo download
    required: false
    default: ""
  find-links:
    description: Path to directory containing pre-built wheels
    required: false
    default: ""
  no-binary-packages:
    description: Space-separated list of packages to allow source builds for (e.g. private pure-Python packages with no PyPI wheel)
    required: false
    default: ""

outputs:
  s3-object-version:
    description: VersionId of uploaded object
    value: ${{ steps.dependencies-zip-to-s3.outputs.version-id }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}
        version: "0.9.13"
    
    - name: Convert pip's platform to uv
      id: convert-platform
      shell: bash
      run: |
        platform="${{ inputs.platform }}"
        case "$platform" in
          manylinux2014_x86_64) platform="x86_64-manylinux_2_17" ;;
          manylinux_2_28_x86_64) platform="x86_64-manylinux_2_28" ;;
        esac
        echo "platform=$platform" >> $GITHUB_OUTPUT

    - name: Create dependencies zip
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.gh-token }}
      run: |
        sudo apt install -y zip
        mkdir -p ./python
        if [ -n "$GITHUB_TOKEN" ]; then
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/Actaware".insteadOf "https://github.com/Actaware"
        fi

        NO_BINARY_FLAGS=""
        if [ -n "${{ inputs.no-binary-packages }}" ]; then
          NO_BINARY_FLAGS=$(echo "${{ inputs.no-binary-packages }}" | tr ',' '\n' | grep -v '^$' | sed 's/^/--no-binary=/' | tr '\n' ' ')
        fi

        uv pip install \
          --python-platform ${{ steps.convert-platform.outputs.platform }} \
          --only-binary=:all: \
          ${{ inputs.find-links != '' && format('--find-links={0}', inputs.find-links) || '' }} \
          $NO_BINARY_FLAGS \
          ${{ inputs.packages }} \
          --target ./python

        zip -r ${{ inputs.layer-file-name }} ./python -x "*pycache*"
        rm -rf ./python

    - name: Upload dependencies zip to S3
      id: "dependencies-zip-to-s3"
      uses: "actaware/actions/aws-s3-upload@dev"
      with:
        file-path: ${{ inputs.layer-file-name }}
        s3-bucket-name: ${{ inputs.s3-bucket-name }}
        s3-object-key: "${{ inputs.s3-layers-location }}${{ inputs.layer-file-name }}"