name: Get ecr image uri
description: Outputs the digest based uri to the specified image
inputs:
  ecr-repository-name:
    description: name of the ECR repository
    required: true
  image-tag:
    description: tag of the image
    required: true
  aws-account-id:
    description: id of aws account
    required: true
  aws-region:
    description: aws region name
    required: true

outputs:
  image-uri:
    description: Digest based uri to the image
    value: ${{ steps.get-image-uri.outputs.image-uri }}

runs:
  using: composite
  steps:
    - name: Get image uri
      id: "get-image-uri"
      shell: bash
      run: |
        base_uri="${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com/${{ inputs.ecr-repository-name }}"

        digest=$(aws ecr describe-images \
          --repository-name "${{ inputs.ecr-repository-name }}" \
          --query "imageDetails[?imageTags[?contains(@, '${{ inputs.image-tag }}')]].imageDigest" \
          --output text)

        image_uri="${base_uri}@${digest}"

        echo "image-uri=$image_uri" >> $GITHUB_OUTPUT
